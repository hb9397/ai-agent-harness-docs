name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate upstream registry
        run: python maintainer/skills/skill-portfolio-maintainer/scripts/validate_registry.py
      - name: Run all canonical skill regression suites
        run: python maintainer/skills/harness-plugin-maintainer/scripts/run_all_skill_evals.py
      - name: Check deterministic generated payload
        run: python maintainer/skills/harness-plugin-maintainer/scripts/build_plugin.py --check
      - name: Validate plugin
        run: python maintainer/skills/harness-plugin-maintainer/scripts/validate_plugin.py
      - name: Install official plugin CLIs
        run: |
          npm install --global @openai/codex@0.146.0
          npm install --global @anthropic-ai/claude-code@2.1.220
      - name: Smoke isolated Codex and Claude installs
        run: python maintainer/skills/harness-plugin-maintainer/scripts/smoke_cli_install.py
      - name: Check manager projections
        run: python maintainer/skills/harness-plugin-maintainer/scripts/sync_manager_projections.py --check
      - name: Ensure checks did not mutate tracked output
        run: git diff --exit-code
